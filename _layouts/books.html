---
layout: default
permalink: /books/
---
<div class="home">
  {%- if page.title -%}
    <h1 class="page-heading">{{ page.title }}</h1>
  {%- endif -%}
  
  {{ content }}

<style>
  /* ── carousel shell ── */
  .bc {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 0 3rem;
    user-select: none;
  }

  /* ── nav row: arrow + stage + arrow ── */
  .bc-nav {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    width: 100%;
    max-width: 520px;
  }

  .bc-arrow {
    background: none;
    border: 2px solid currentColor;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    cursor: pointer;
    color: inherit;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.65;
    transition: opacity 0.18s, transform 0.18s;
  }
  .bc-arrow:hover  { opacity: 1; transform: scale(1.1); }
  .bc-arrow.hidden { visibility: hidden; pointer-events: none; }

  /* ── the visible stage (clips the sliding track) ── */
  .bc-stage {
    overflow: hidden;
    flex: 1;
  }

  /* ── sliding track ── */
  .bc-track {
    display: flex;
    transition: transform 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }

  /* ── each slide ── */
  .bc-slide {
    flex: 0 0 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }

  /* cover image */
  .bc-cover {
    height: 380px;
    width: auto;
    max-width: 100%;
    object-fit: cover;
    border-radius: 3px;
    box-shadow: 0 10px 36px rgba(0,0,0,0.25);
    transition: transform 0.28s ease, box-shadow 0.28s ease;
    display: block;
  }
  .bc-slide:hover .bc-cover {
    transform: translateY(-5px) scale(1.015);
    box-shadow: 0 18px 44px rgba(0,0,0,0.32);
  }

  /* click hint */
  .bc-hint {
    margin-top: 0.6rem;
    font-size: 0.72rem;
    opacity: 0.38;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── dot indicators ── */
  .bc-dots {
    display: flex;
    gap: 7px;
    margin-top: 1.4rem;
  }
  .bc-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.2;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: opacity 0.22s, transform 0.22s;
  }
  .bc-dot.active { opacity: 0.75; transform: scale(1.3); }

  /* ── iframe modal ── */
  .bc-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
  }
  .bc-modal.open { display: flex; }

  .bc-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    animation: bc-fade-in 0.22s ease;
  }

  .bc-modal-box {
    position: relative;
    z-index: 1;
    margin: auto;
    width: min(92vw, 860px);
    height: min(88vh, 900px);
    display: flex;
    flex-direction: column;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.55);
    animation: bc-slide-up 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .bc-modal-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0.75rem;
    background: rgba(0,0,0,0.85);
    color: #fff;
    font-size: 0.82rem;
    gap: 0.75rem;
    flex-shrink: 0;
  }

  .bc-modal-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.85;
  }

  .bc-modal-close {
    background: none;
    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 50%;
    color: #fff;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.75;
    transition: opacity 0.15s, transform 0.15s;
  }
  .bc-modal-close:hover { opacity: 1; transform: scale(1.12); }

  .bc-iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #fff;
  }

  @keyframes bc-fade-in  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bc-slide-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
</style>

{% assign books_arr = site.books | reverse %}
<script>
var CAROUSEL_BOOKS = [
  {%- for book in books_arr -%}
  {
    url:         "{{ book.url | relative_url }}",
    image:       "{{ book.ImageLink }}",
    title:       {{ book.title       | default: ""  | jsonify }},
  }{% unless forloop.last %},{% endunless %}
  {%- endfor -%}
];
</script>

<!-- carousel -->
<div class="bc" id="bc">
  <div class="bc-nav">
    <button class="bc-arrow hidden" id="bc-prev" aria-label="Previous">&#8592;</button>
    <div class="bc-stage">
      <div class="bc-track" id="bc-track"></div>
    </div>
    <button class="bc-arrow" id="bc-next" aria-label="Next">&#8594;</button>
  </div>
  <div class="bc-dots" id="bc-dots"></div>
</div>

<!-- iframe modal (shared, single instance) -->
<div class="bc-modal" id="bc-modal" role="dialog" aria-modal="true" aria-label="Book details">
  <div class="bc-backdrop" id="bc-backdrop"></div>
  <div class="bc-modal-box">
    <div class="bc-modal-bar">
      <span class="bc-modal-title" id="bc-modal-title"></span>
      <button class="bc-modal-close" id="bc-modal-close" aria-label="Close">&#x2715;</button>
    </div>
    <iframe class="bc-iframe" id="bc-iframe" src="" title="Book details"></iframe>
  </div>
</div>

<script>
(function () {
  var books   = CAROUSEL_BOOKS;
  var track   = document.getElementById('bc-track');
  var prev    = document.getElementById('bc-prev');
  var next    = document.getElementById('bc-next');
  var dotsEl  = document.getElementById('bc-dots');
  var modal   = document.getElementById('bc-modal');
  var iframe  = document.getElementById('bc-iframe');
  var modalTitle = document.getElementById('bc-modal-title');
  var current = 0;

  /* ── build slides ── */
  books.forEach(function (book, i) {
    var slide = document.createElement('div');
    slide.className = 'bc-slide';
    slide.innerHTML =
      '<img class="bc-cover" src="' + book.image + '" alt="' + esc(book.title) + '" loading="lazy">' +
	  '<p>' + book.title + '</p>' +
      '<span class="bc-hint">tap to open</span>';

    slide.addEventListener('click', function () {
      if (i !== current) return;
      openModal(book);
    });

    track.appendChild(slide);
  });

  /* ── dots ── */
  books.forEach(function (_, i) {
    var dot = document.createElement('button');
    dot.className = 'bc-dot';
    dot.setAttribute('aria-label', 'Book ' + (i + 1));
    dot.addEventListener('click', function () { goTo(i); });
    dotsEl.appendChild(dot);
  });

  /* ── navigation ── */
  prev.addEventListener('click', function () { goTo(current - 1); });
  next.addEventListener('click', function () { goTo(current + 1); });

  function goTo(idx) {
    current = Math.max(0, Math.min(idx, books.length - 1));
    track.style.transform = 'translateX(-' + (current * 100) + '%)';
    prev.classList.toggle('hidden', current === 0);
    next.classList.toggle('hidden', current === books.length - 1);
    dotsEl.querySelectorAll('.bc-dot').forEach(function (d, i) {
      d.classList.toggle('active', i === current);
    });
  }

  /* ── modal ── */
  function openModal(book) {
    modalTitle.textContent = book.title || '';
    iframe.src = book.url;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
    /* clear src after transition so the old page doesn't flash on re-open */
    setTimeout(function () { iframe.src = ''; }, 250);
  }

  document.getElementById('bc-modal-close').addEventListener('click', closeModal);
  document.getElementById('bc-backdrop').addEventListener('click', closeModal);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  /* ── helper ── */
  function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  
  goTo(0);
})();
</script>
